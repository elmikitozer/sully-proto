<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f2ed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f5fff'/%3E%3Cpath d='M20 44l12-26 12 26-12-6z' fill='white'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" />
    <style>
      /* Splash shown until React mounts (the map data is a big bundle). */
      #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #f4f2ed; font: 700 32px/1 'Space Grotesk', system-ui, sans-serif; color: #1f5fff; letter-spacing: -1px }
      #splash span { animation: pulse 1.2s ease-in-out infinite }
      @keyframes pulse { 50% { opacity: .35 } }
      @media (prefers-color-scheme: dark) { #splash { background: #0b1020; color: #5b8cff } }
    </style>
    <title>Sully · Orly</title>
    <meta name="description" content="Sully, your co-pilot inside Paris-Orly: gate, security, walking times, step-by-step guidance." />
  </head>
  <body>
    <div id="root"><div id="splash"><span>Sully</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
